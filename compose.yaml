# Whole stack: `docker compose up --build` (Postgres + the service; the service seeds the Knowledge Base on first start).
# Local development: `./mvnw spring-boot:run` starts only the postgres service from this file
# (spring.docker.compose.start.arguments in application.yaml).
# Every setting below can be overridden from the shell or a `.env` file next to this file (see README).
services:
  postgres:
    image: pgvector/pgvector:pg17
    labels:
      # lets `./mvnw spring-boot:run` connect to it (Spring Boot does not recognise the pgvector image by name)
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: expert-knowledge-assistant:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    # lets the container reach LM Studio / Ollama on the host as host.docker.internal (also on Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - snapshots:/app/snapshots
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/knowledge
      DB_USER: knowledge
      DB_PASSWORD: knowledge
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      SNAPSHOT_MODE: ${SNAPSHOT_MODE:-record}
      INGESTION_CRON: ${INGESTION_CRON:--}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-offline}
      CHAT_OPENAI_BASE_URL: ${CHAT_OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      CHAT_OPENAI_MODEL: ${CHAT_OPENAI_MODEL:-qwen/qwen3.5-9b}
      CHAT_OPENAI_API_KEY: ${CHAT_OPENAI_API_KEY:-}
      CHAT_ANTHROPIC_MODEL: ${CHAT_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:1234/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}

volumes:
  postgres-data:
  # fetched Source pages (record), replayed with SNAPSHOT_MODE=replay (ADR-0004)
  snapshots:
